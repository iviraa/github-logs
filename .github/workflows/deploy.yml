name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check src lambdas

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: sam build -t infrastructure/template.yaml
      - name: sam deploy
        run: |
          sam deploy -t infrastructure/template.yaml \
            --stack-name github-logs \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              GitHubUsername=${{ vars.GITHUB_USERNAME_TARGET }} \
              GitHubSecretArn=${{ secrets.GITHUB_SECRET_ARN }} \
              NotificationEmail=${{ vars.NOTIFICATION_EMAIL }} \
              BedrockModelId=${{ vars.BEDROCK_MODEL_ID }} \
              Region=${{ vars.AWS_REGION }}
