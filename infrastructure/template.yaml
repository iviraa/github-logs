AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: github-logs - serverless GitHub activity intelligence

Parameters:
  GitHubUsername:
    Type: String
    Description: GitHub login whose activity is collected.
  GitHubSecretArn:
    Type: String
    Description: ARN of Secrets Manager secret holding the GitHub PAT.
  NotificationEmail:
    Type: String
    Description: "Recipient email address (SES To: address)."
  SenderEmail:
    Type: String
    Description: "Sender email address (SES From: address). Must be verified in SES."
  BedrockModelId:
    Type: String
    Description: Bedrock model id for the summarizer (a Claude model in your region).
  Region:
    Type: String
    Default: us-east-1

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 60
    Architectures: [arm64]
    Environment:
      Variables:
        LOG_LEVEL: INFO
        GITHUB_USERNAME: !Ref GitHubUsername
        ACTIVITY_TABLE: !Ref ActivityTable
        REPORTS_TABLE: !Ref ReportsTable
        RAW_ARCHIVE_BUCKET: !Ref RawArchiveBucket
        REPORTS_BUCKET: !Ref ReportsBucket
        SENDER_EMAIL: !Ref SenderEmail
        RECIPIENT_EMAIL: !Ref NotificationEmail
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        GITHUB_SECRET_ARN: !Ref GitHubSecretArn
        ATHENA_WORKGROUP: !Ref AnalyticsWorkGroup
        GLUE_DATABASE: !Ref AnalyticsDatabase

Resources:
  ActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: github-logs-activity
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: github-logs-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RawArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Note: the SES sender identity for ${SenderEmail} must be verified in the
  # SES console before the first deploy. CloudFormation does not manage it.

  AnalyticsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: github_logs
        Description: Schema for github-logs activity data lake.

  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: ReadProcessedTier
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${RawArchiveBucket.Arn}/processed/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt RawArchiveBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - "processed/*"

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: github-logs
      Description: Workgroup for github-logs Athena queries.
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false
        BytesScannedCutoffPerQuery: 1073741824  # 1 GiB hard cap per query
        ResultConfiguration:
          OutputLocation: !Sub "s3://${RawArchiveBucket}/athena-results/"

  ActivityCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: github-logs-activity-crawler
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref AnalyticsDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${RawArchiveBucket}/processed/github/activity/"
      Schedule:
        ScheduleExpression: cron(0 19 ? * SUN *)
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING
      Configuration: |
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Partitions": { "AddOrUpdateBehavior": "InheritFromTable" }
          }
        }

  GitHubCollectorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      CodeUri: ../
      Handler: lambdas.github_collector_handler.lambda_handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ActivityTable
        - S3WritePolicy:
            BucketName: !Ref RawArchiveBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubSecretArn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 23 * * ? *)
            Name: github-logs-daily-collect
            Description: Collect GitHub activity nightly at 23:00 UTC.

  WeeklySummaryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      CodeUri: ../
      Handler: lambdas.weekly_summary_handler.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ActivityTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - S3WritePolicy:
            BucketName: !Ref ReportsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*"
      Events:
        Weekly:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 ? * SUN *)
            Name: github-logs-weekly-summary
            Description: Produce a weekly summary every Sunday at 20:00 UTC.

  MonthlySummaryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      CodeUri: ../
      Handler: lambdas.monthly_summary_handler.lambda_handler
      Timeout: 600
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - S3WritePolicy:
            BucketName: !Ref ReportsBucket
        - S3ReadPolicy:
            BucketName: !Ref RawArchiveBucket
        - S3CrudPolicy:
            BucketName: !Ref RawArchiveBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*"
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:StopQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AnalyticsWorkGroup}"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetTables
                - glue:GetPartition
                - glue:GetPartitions
              Resource:
                - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${AnalyticsDatabase}"
                - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${AnalyticsDatabase}/*"
      Events:
        Monthly:
          Type: Schedule
          Properties:
            Schedule: cron(0 21 1 * ? *)
            Name: github-logs-monthly-summary
            Description: Produce a monthly retrospective on the 1st of each month at 21:00 UTC.

Outputs:
  ActivityTableName:
    Value: !Ref ActivityTable
  ReportsTableName:
    Value: !Ref ReportsTable
  RawArchiveBucketName:
    Value: !Ref RawArchiveBucket
  ReportsBucketName:
    Value: !Ref ReportsBucket
  AnalyticsDatabaseName:
    Value: !Ref AnalyticsDatabase
  ActivityCrawlerName:
    Value: !Ref ActivityCrawler
  AnalyticsWorkGroupName:
    Value: !Ref AnalyticsWorkGroup
